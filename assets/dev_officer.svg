<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="officerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldStars" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39C12"/>
      <stop offset="50%" stop-color="#F1C40F"/>
      <stop offset="100%" stop-color="#D4AC0D"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#officerBg)" rx="20"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#goldStars)" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- Officer Star Crest -->
  <path d="M 200 60 L 212 95 L 248 95 L 219 116 L 230 150 L 200 128 L 170 150 L 181 116 L 152 95 L 188 95 Z" fill="url(#goldStars)"/>
  <!-- Officer Silhouette -->
  <circle cx="200" cy="180" r="45" fill="#38bdf8" opacity="0.3"/>
  <path d="M 200 135 A 40 40 0 0 1 200 215 A 40 40 0 0 1 200 135 Z" fill="#e2e8f0" opacity="0.9"/>
  <!-- Uniform Cap & Stars -->
  <path d="M 155 145 Q 200 120 245 145 L 240 160 Q 200 150 160 160 Z" fill="#0284c7"/>
  <path d="M 140 280 Q 200 220 260 280 L 250 330 L 150 330 Z" fill="#1e293b"/>
  <polygon points="195,215 205,215 203,260 197,260" fill="#dc2626"/>
  <text x="200" y="355" font-family="'Outfit', sans-serif" font-size="18" font-weight="600" fill="#f8fafc" text-anchor="middle">Click to Add Officer Dev's Photo</text>
  <text x="200" y="375" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">( Passing Out Parade Portrait )</text>
</svg>
